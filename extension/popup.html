<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 360px; padding: 16px; }
      .habit { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
      .habit:last-child { border-bottom: 0; }
      .habit .em { width: 36px; height: 36px; border-radius: 50%; background: var(--card-3); display: grid; place-items: center; font-size: 17px; flex: none; }
      .habit .body { flex: 1; min-width: 0; }
      .habit .t { font-weight: 700; }
      .habit.done .t { color: var(--muted); text-decoration: line-through; }
      .habit .m { font-size: 12px; color: var(--muted); margin-top: 3px; }
      .session { background: linear-gradient(135deg, rgba(79,196,145,.16), rgba(79,196,145,.04)); border-color: rgba(79,196,145,.3); }
      .timer { font: 700 30px "JetBrains Mono", ui-monospace, monospace; letter-spacing: -0.03em; }
      .site { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
      section + section { margin-top: 12px; }
      .foot { display: flex; justify-content: space-between; margin-top: 14px; }
    </style>
  </head>
  <body>
    <div class="row between" style="margin-bottom: 14px">
      <div class="brand"><span class="mark">L</span><span>Life<b>Helper</b></span></div>
      <span id="streak" class="pill"></span>
    </div>
    <div id="app"><div class="muted">Загрузка…</div></div>
    <div class="foot">
      <button class="ghost" id="open">Открыть сайт ↗</button>
      <button class="ghost" id="refresh">Обновить</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
